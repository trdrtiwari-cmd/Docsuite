name: Build DocSuite APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle viewer libraries (so the app works offline)
        run: |
          set -e
          L="$GITHUB_WORKSPACE/app/src/main/assets/lib"
          mkdir -p "$L" /tmp/libs && cd /tmp/libs
          npm pack pdfjs-dist@3.11.174 xlsx@0.18.5 mammoth@1.6.0 jszip@3.10.1 marked@12.0.2 dompurify@3.1.6
          for f in *.tgz; do d="${f%.tgz}"; mkdir -p "$d"; tar xzf "$f" -C "$d"; done
          pick() { p=$(find "$1" -path "*/$2" | head -1); [ -n "$p" ] || { echo "Missing $2 in $1"; exit 1; }; cp "$p" "$L/$3"; echo "bundled $3 <- $p"; }
          pick pdfjs-dist-3.11.174 build/pdf.min.js        pdf.min.js
          pick pdfjs-dist-3.11.174 build/pdf.worker.min.js pdf.worker.min.js
          pick xlsx-0.18.5        dist/xlsx.full.min.js    xlsx.full.min.js
          pick mammoth-1.6.0      mammoth.browser.min.js   mammoth.browser.min.js
          pick jszip-3.10.1       dist/jszip.min.js        jszip.min.js
          pick dompurify-3.1.6    dist/purify.min.js       purify.min.js
          if find marked-12.0.2 -path "*/package/marked.min.js" | grep -q .; then
            pick marked-12.0.2 package/marked.min.js marked.min.js
          else
            pick marked-12.0.2 lib/marked.umd.js marked.min.js
          fi
          ls -la "$L"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DocSuite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DocSuite-apk
          path: DocSuite.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DocSuite v1.0.${{ github.run_number }}
          body: |
            Download **DocSuite.apk** below and open it on your Android phone to install.
            (Allow "Install unknown apps" for your browser or file manager if asked.)
          files: DocSuite.apk
