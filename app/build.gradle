plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.docsuite.viewer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.docsuite.viewer'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Fixed key so each new APK installs as an update over the previous one.
    signingConfigs {
        release {
            storeFile file('docsuite.keystore')
            storePassword 'docsuite'
            keyAlias 'docsuite'
            keyPassword 'docsuite'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align Kotlin stdlib versions pulled in by AndroidX (avoids duplicate-class errors)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
